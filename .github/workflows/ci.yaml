name: CI Pipeline

run-name: "CI: ${{ github.event_name != 'pull_request' && github.event.head_commit.message || github.event.pull_request.title }}"

on: 
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build from source
    strategy:
      matrix:
        config: [Debug, Release]
    env:
      vs_url: https://archive.org/download/vs-2008-express-w-sp-1/VS2008-Express-w-SP1.ISO
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            LEKMOD/
            !LEKMOD/*.dll
            LEKMOD_DLL/
            !**/BuildOutput/
            !**/BuildTemp/
          sparse-checkout-cone-mode: false

      - name: Cache Visual Studio 2008 Installer
        id: cache-vs2008-install
        uses: actions/cache@v4
        with:
          path: vs2008
          key: ${{ runner.os }}-vs2008-install

      - name: Download Visual Studio 2008 Installer
        if: steps.cache-vs2008-install.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco install 7zip.install
          Invoke-WebRequest "$($Env:vs_url)" -OutFile vs2008.iso
          7z.exe x -y -o".\vs2008" vs2008.iso

      - name: Install Visual C++ 2008
        shell: pwsh
        run: |
          Start-Process -FilePath ".\vs2008\VCExpress\setup.exe" -ArgumentList "/q" -Wait
          Get-Content -Path "$([System.IO.Path]::GetTempPath())VSMsi*.txt" -ErrorAction SilentlyContinue

      - name: Build Project
        shell: pwsh
        run: |
          C:\Program` Files` `(x86`)\Microsoft` Visual` Studio` 9.0\VC\vcpackages\vcbuild.exe "LEKMOD_DLL\CvGameCoreDLL_Expansion2\CvGameCoreDLL_Expansion2.vcproj" ${{ matrix.config }}

      - name: Prepare Artifact
        if: ${{ github.event_name != 'pull_request' }}
        shell: pwsh
        run: |
          Copy-Item "LEKMOD_DLL\CvGameCoreDLL_Expansion2\BuildOutput\VS2008_${{ matrix.config }}Win32\CvGameCore_Expansion2.dll" -Destination LEKMOD
          if ("${{ matrix.config }}" -eq "Debug") {
            Copy-Item "LEKMOD_DLL\CvGameCoreDLL_Expansion2\BuildOutput\VS2008_${{ matrix.config }}Win32\CvGameCore_Expansion2.*" -Destination LEKMOD
          }
          mkdir artifact
          Move-Item -Path LEKMOD -Destination artifact

      - name: Upload Artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: Lekmod-CI-Win32-${{ matrix.config }}
          path: artifact

  build-macos:
    name: Build macOS port
    runs-on: macos-14
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Test macOS tooling and UI configuration
        run: |
          for script in LEKMOD_DLL/macos/*.sh LEKMOD_DLL/macos/steam-compat/Launch-Steam.command; do bash -n "$script"; done
          python3 -m py_compile LEKMOD_DLL/macos/configure-ui.py LEKMOD_DLL/macos/automated-playtest.py LEKMOD_DLL/macos/steam-compat/patch-steam.py
          python3 LEKMOD_DLL/macos/test-configure-ui.py
          python3 LEKMOD_DLL/macos/test-automated-playtest.py
          python3 LEKMOD_DLL/macos/bootstrap-test-lua.py
          python3 LEKMOD_DLL/macos/test-optional-options-control.py
          python3 LEKMOD_DLL/macos/test-playtest-batch.py
          python3 LEKMOD_DLL/macos/test-lifecycle-playtest.py
          build/macos/test-deps/lua-5.1.4/src/lua LEKMOD_DLL/macos/test-batch-driver.lua LEKMOD_DLL/macos
          build/macos/test-deps/lua-5.1.4/src/lua LEKMOD_DLL/macos/test-unit-owner-boundaries.lua LEKMOD/Lua/Civilizations
          build/macos/test-deps/lua-5.1.4/src/lua LEKMOD_DLL/macos/test-nabatea-exploration.lua LEKMOD/Lua/Civilizations/Lekmod_nabatea.lua
          build/macos/test-deps/lua-5.1.4/src/lua LEKMOD_DLL/macos/test-city-policy-boundaries.lua LEKMOD/Lua/Civilizations
          build/macos/test-deps/lua-5.1.4/src/lua LEKMOD_DLL/macos/test-tonga-exploration.lua LEKMOD/Lua
          build/macos/test-deps/lua-5.1.4/src/lua LEKMOD_DLL/macos/test-kilwa-routes.lua LEKMOD/Lua
          python3 LEKMOD_DLL/macos/test-unit-handlers.py
          python3 LEKMOD_DLL/macos/test-scenario-core.py
          python3 LEKMOD_DLL/macos/test-temporary-eui.py
          python3 LEKMOD_DLL/macos/test-lua-unit-position.py
          python3 LEKMOD_DLL/macos/test-lua-team-tech.py
          python3 LEKMOD_DLL/macos/test-trade-building-cache.py
          python3 LEKMOD_DLL/macos/test-trade-tooltip-precision.py
          python3 LEKMOD_DLL/macos/test-trade-incoming-owner.py
          python3 LEKMOD_DLL/macos/test-trade-incoming-tourism.py
          python3 LEKMOD_DLL/macos/test-trade-removal-event.py
          python3 LEKMOD_DLL/macos/test-great-work-swap-ui.py
          python3 LEKMOD_DLL/macos/test-religion-diversity-cache.py
          python3 LEKMOD_DLL/macos/test-tech-trait-yield-cache.py
          python3 LEKMOD_DLL/macos/test-player-color-holes.py
          python3 LEKMOD_DLL/macos/test-counterspy-outcomes.py
          python3 LEKMOD_DLL/macos/test-lua-stack-moves.py
          build/macos/test-deps/lua-5.1.4/src/lua LEKMOD_DLL/macos/test-maori-expiry.lua LEKMOD/Lua/Civilizations/Lekmod_maori.lua
          build/macos/test-deps/lua-5.1.4/src/lua LEKMOD_DLL/macos/test-cuba-capital-culture.lua LEKMOD/Lua/Civilizations/Lekmod_cuba.lua
          build/macos/test-deps/lua-5.1.4/src/lua LEKMOD_DLL/macos/test-moors-era.lua LEKMOD/Lua/Civilizations/Lekmod_moors.lua
          python3 LEKMOD_DLL/macos/test-lua-script-data.py
          python3 LEKMOD_DLL/macos/test-batch-allocate.py
          clang++ -std=c++11 LEKMOD_DLL/macos/test-random-seed.cpp -o "$RUNNER_TEMP/test-random-seed"
          "$RUNNER_TEMP/test-random-seed"

      - name: Build, validate, and package
        run: LEKMOD_DLL/macos/package-macos.sh

      - name: Upload artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: Lekmod-CI-macOS-x86_64
          path: build/macos/Lekmod-native.zip
